<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ice Cream Shop</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <main>
        <h1>Ice Cream Shop</h1>
        <p class="intro">Manage the flavors on today's menu.</p>

        <section>
            <h2>Add a flavor</h2>
            <form id="add-form">
                <label for="add-name">Flavor name</label>
                <input type="text" id="add-name" placeholder="New ice cream flavor" required>
                <label class="checkbox-label">
                    <input type="checkbox" id="add-isDairyFree">
                    Dairy-free
                </label>
                <button type="submit">Add flavor</button>
            </form>
        </section>

        <section id="editForm" hidden>
            <h2>Edit flavor</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <label for="edit-name">Flavor name</label>
                <input type="text" id="edit-name" required>
                <label class="checkbox-label">
                    <input type="checkbox" id="edit-isDairyFree">
                    Dairy-free
                </label>
                <button type="submit">Save changes</button>
                <button type="button" class="secondary" id="close-edit">Cancel</button>
            </form>
        </section>

        <p id="message" role="status" aria-live="polite"></p>
        <p id="counter"></p>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Dairy-free</th>
                        <th scope="col">Flavor</th>
                        <th scope="col"><span class="visually-hidden">Actions</span></th>
                    </tr>
                </thead>
                <tbody id="ice-creams"></tbody>
            </table>
        </div>
    </main>
    <script src="js/site.js"></script>
</body>
</html>
